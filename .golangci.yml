version: "2"
linters:
  enable:
    - exhaustive
  settings:
    exhaustive:
      ignore-types:
        - "^crypto/x509\\."
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - staticcheck
        text: 'SA1019: \(crypto/ecdsa\.(PublicKey|PrivateKey)\)\.(X|Y|D) has been deprecated'
